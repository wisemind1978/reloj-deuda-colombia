name: Actualizar datos del reloj

# CUÁNDO se ejecuta el robot:
on:
  schedule:
    - cron: "0 10 * * *"   # todos los días a las 10:00 UTC = 5:00 a.m. en Colombia
  workflow_dispatch: {}     # además, un botón para correrlo a mano cuando quieras

jobs:
  actualizar:
    runs-on: ubuntu-latest          # el robot corre en un computador de GitHub (no en tu Mac)
    permissions:
      contents: write               # permiso para guardar (commitear) el data.json actualizado
    steps:
      - name: Bajar el código del repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install xlrd

      - name: Actualizar la TRM (dólar)
        run: python scripts/actualizar_trm.py

      - name: Actualizar la deuda (Excel oficial del IRC)
        run: python scripts/actualizar_deuda.py

      - name: Guardar los cambios (solo si algo cambió)
        run: |
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git config user.name "reloj-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "auto: datos actualizados $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Sin cambios en data.json — todo estaba al día."
          fi
